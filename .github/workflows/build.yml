name: build-apk
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and unpack V2rayAG code
        run: |
          flutter create --org com.v2rayag --project-name v2rayag --platforms android .
          echo "" | base64 -d | tar xz
          cp -r overlay/lib/. lib/
          cp -r overlay/test/. test/
          cp -r overlay/assets assets
          cp overlay/flutter_launcher_icons.yaml .
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/res/drawable
          cp overlay/android/app/src/main/res/drawable/* android/app/src/main/res/drawable/
          mkdir -p android/app/src/main/res/raw
          cp overlay/android/app/src/main/res/raw/* android/app/src/main/res/raw/
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>\n    <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#your_app#v2rayag#' test/pool_engine_test.dart
          F=$(find android/app/src/main -name MainActivity.kt | head -1)
          cp overlay/android/MainActivity.kt "$F"
          cp overlay/android/PsiphonBridge.kt "$(dirname "$F")/PsiphonBridge.kt"
          sed -i '0,/^android {/s//android {\n    packaging {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' android/app/build.gradle.kts || true
          sed -i '0,/^android {/s//android {\n    packagingOptions {\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }/' android/app/build.gradle || true
          if ! grep -q useLegacyPackaging android/app/build.gradle.kts android/app/build.gradle 2>/dev/null; then sed -i 's#<application#<application android:extractNativeLibs="true"#' android/app/src/main/AndroidManifest.xml; fi
          echo "--- manifest ---"; grep -n "extractNativeLibs\|uses-permission" android/app/src/main/AndroidManifest.xml
          echo "--- gradle ---"; grep -n "useLegacyPackaging\|minSdk\|targetSdk\|compileSdk" android/app/build.gradle* || true
          cat >> android/app/build.gradle.kts <<'GRADLE'
          
          repositories {
              maven { url = uri("https://raw.github.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master") }
          }
          dependencies {
              implementation("ca.psiphon:psiphontunnel:2.0.41")
          }
          GRADLE
          echo "--- psiphon dependency ---"; grep -n "psiphontunnel" android/app/build.gradle.kts || true
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          flutter pub add flutter_vless
          flutter pub add file_picker
          flutter pub add sing_box
          flutter pub add yaml
      - name: Strip duplicate Go classes from Psiphon AAR
        run: |
          mkdir -p android/app/libs
          curl -fL -o psiphontunnel-2.0.41.aar https://raw.github.com/Psiphon-Labs/psiphon-tunnel-core-Android-library/master/ca/psiphon/psiphontunnel/2.0.41/psiphontunnel-2.0.41.aar
          python3 - <<'PY'
          import io, zipfile
          src = 'psiphontunnel-2.0.41.aar'
          zin = zipfile.ZipFile(src)
          cj = zin.read('classes.jar')
          cin = zipfile.ZipFile(io.BytesIO(cj))
          buf = io.BytesIO()
          cout = zipfile.ZipFile(buf, 'w', zipfile.ZIP_DEFLATED)
          removed = 0
          for item in cin.infolist():
              if item.filename.startswith('go/'):
                  removed += 1
                  continue
              cout.writestr(item, cin.read(item.filename))
          cout.close()
          newcj = buf.getvalue()
          buf2 = io.BytesIO()
          aout = zipfile.ZipFile(buf2, 'w', zipfile.ZIP_DEFLATED)
          for item in zin.infolist():
              data = newcj if item.filename == 'classes.jar' else zin.read(item.filename)
              aout.writestr(item, data)
          aout.close()
          open('android/app/libs/psiphontunnel-2.0.41.aar', 'wb').write(buf2.getvalue())
          z = zipfile.ZipFile(io.BytesIO(newcj))
          assert not any(n.startswith('go/') for n in z.namelist()), 'go/ entries remain'
          print('removed go classes:', removed)
          assert removed > 0, 'no go classes found to strip'
          print('verified: no go/ entries left in stripped classes.jar')
          PY
          sed -i 's#implementation("ca.psiphon:psiphontunnel:2.0.41")#implementation(files("libs/psiphontunnel-2.0.41.aar"))#' android/app/build.gradle.kts
          echo "--- psiphon dependency after strip ---"; grep -n "psiphontunnel" android/app/build.gradle.kts || true
          ls -l android/app/libs/
      - name: App icon
        continue-on-error: true
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons
      - name: Run tests
        run: flutter test
        continue-on-error: true
      - name: Build APK
        env:
          POOL_LIST: ${{ secrets.POOL_LIST }}
          POOL_URL: ${{ secrets.POOL_URL }}
          PROVIDERS_JSON: ${{ secrets.PROVIDERS_JSON }}
          PROVIDER_FAST: ${{ secrets.PROVIDER_FAST }}
          PROVIDER_UPDATE: ${{ secrets.PROVIDER_UPDATE }}
          PROVIDER_V2RAYAG: ${{ secrets.PROVIDER_V2RAYAG }}
          PROVIDER_ANTIFILTER: ${{ secrets.PROVIDER_ANTIFILTER }}
          PROVIDER_HIDDIFY: ${{ secrets.PROVIDER_HIDDIFY }}
          PROVIDER_UNLIMITED: ${{ secrets.PROVIDER_UNLIMITED }}
          PSIPHON_JSON: ${{ secrets.PSIPHON_JSON }}
          UNLIMITED_CONFIGS: ${{ secrets.UNLIMITED_CONFIGS }}
        run: |
          LIST=$(printf '%s' "$POOL_LIST" | tr '\r\n' ',,' | sed 's/,,*/,/g;s/^,//;s/,$//')
          PROV_B64=$(printf '%s' "$PROVIDERS_JSON" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDERS_JSON" | base64)
          FAST_B64=$(printf '%s' "$PROVIDER_FAST" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_FAST" | base64)
          UPD_B64=$(printf '%s' "$PROVIDER_UPDATE" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_UPDATE" | base64)
          V2_B64=$(printf '%s' "$PROVIDER_V2RAYAG" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_V2RAYAG" | base64)
          AF_B64=$(printf '%s' "$PROVIDER_ANTIFILTER" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_ANTIFILTER" | base64)
          HID_B64=$(printf '%s' "$PROVIDER_HIDDIFY" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_HIDDIFY" | base64)
          UNLPROV_B64=$(printf '%s' "$PROVIDER_UNLIMITED" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_UNLIMITED" | base64)
          PSI_B64=$(printf '%s' "$PSIPHON_JSON" | base64 -w0 2>/dev/null || printf '%s' "$PSIPHON_JSON" | base64)
          UNL_B64=$(printf '%s' "$UNLIMITED_CONFIGS" | base64 -w0 2>/dev/null || printf '%s' "$UNLIMITED_CONFIGS" | base64)
          flutter build apk --release --split-per-abi --dart-define=POOL_LIST="$LIST" --dart-define=POOL_URL="$POOL_URL" --dart-define=PROVIDERS_B64="$PROV_B64" --dart-define=PROVIDER_FAST_B64="$FAST_B64" --dart-define=PROVIDER_UPDATE_B64="$UPD_B64" --dart-define=PROVIDER_V2RAYAG_B64="$V2_B64" --dart-define=PROVIDER_ANTIFILTER_B64="$AF_B64" --dart-define=PROVIDER_HIDDIFY_B64="$HID_B64" --dart-define=PROVIDER_UNLIMITED_B64="$UNLPROV_B64" --dart-define=PSIPHON_B64="$PSI_B64" --dart-define=UNLIMITED_B64="$UNL_B64" --dart-define=BUILD_NUM=${{ github.run_number }}
      - name: Collect APKs by architecture
        run: |
          mkdir -p dist
          D=build/app/outputs/flutter-apk
          cp "$D/app-arm64-v8a-release.apk" dist/V2rayAG-arm64-v8a.apk || true
          cp "$D/app-armeabi-v7a-release.apk" dist/V2rayAG-armeabi-v7a.apk || true
      - name: Build universal APK
        continue-on-error: true
        env:
          POOL_LIST: ${{ secrets.POOL_LIST }}
          POOL_URL: ${{ secrets.POOL_URL }}
          PROVIDERS_JSON: ${{ secrets.PROVIDERS_JSON }}
          PROVIDER_FAST: ${{ secrets.PROVIDER_FAST }}
          PROVIDER_UPDATE: ${{ secrets.PROVIDER_UPDATE }}
          PROVIDER_V2RAYAG: ${{ secrets.PROVIDER_V2RAYAG }}
          PROVIDER_ANTIFILTER: ${{ secrets.PROVIDER_ANTIFILTER }}
          PROVIDER_HIDDIFY: ${{ secrets.PROVIDER_HIDDIFY }}
          PROVIDER_UNLIMITED: ${{ secrets.PROVIDER_UNLIMITED }}
          PSIPHON_JSON: ${{ secrets.PSIPHON_JSON }}
          UNLIMITED_CONFIGS: ${{ secrets.UNLIMITED_CONFIGS }}
        run: |
          LIST=$(printf '%s' "$POOL_LIST" | tr '\r\n' ',,' | sed 's/,,*/,/g;s/^,//;s/,$//')
          PROV_B64=$(printf '%s' "$PROVIDERS_JSON" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDERS_JSON" | base64)
          FAST_B64=$(printf '%s' "$PROVIDER_FAST" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_FAST" | base64)
          UPD_B64=$(printf '%s' "$PROVIDER_UPDATE" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_UPDATE" | base64)
          V2_B64=$(printf '%s' "$PROVIDER_V2RAYAG" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_V2RAYAG" | base64)
          AF_B64=$(printf '%s' "$PROVIDER_ANTIFILTER" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_ANTIFILTER" | base64)
          HID_B64=$(printf '%s' "$PROVIDER_HIDDIFY" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_HIDDIFY" | base64)
          UNLPROV_B64=$(printf '%s' "$PROVIDER_UNLIMITED" | base64 -w0 2>/dev/null || printf '%s' "$PROVIDER_UNLIMITED" | base64)
          PSI_B64=$(printf '%s' "$PSIPHON_JSON" | base64 -w0 2>/dev/null || printf '%s' "$PSIPHON_JSON" | base64)
          UNL_B64=$(printf '%s' "$UNLIMITED_CONFIGS" | base64 -w0 2>/dev/null || printf '%s' "$UNLIMITED_CONFIGS" | base64)
          flutter build apk --release --dart-define=POOL_LIST="$LIST" --dart-define=POOL_URL="$POOL_URL" --dart-define=PROVIDERS_B64="$PROV_B64" --dart-define=PROVIDER_FAST_B64="$FAST_B64" --dart-define=PROVIDER_UPDATE_B64="$UPD_B64" --dart-define=PROVIDER_V2RAYAG_B64="$V2_B64" --dart-define=PROVIDER_ANTIFILTER_B64="$AF_B64" --dart-define=PROVIDER_HIDDIFY_B64="$HID_B64" --dart-define=PROVIDER_UNLIMITED_B64="$UNLPROV_B64" --dart-define=PSIPHON_B64="$PSI_B64" --dart-define=UNLIMITED_B64="$UNL_B64" --dart-define=BUILD_NUM=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk dist/V2rayAG-universal.apk
      - name: List files
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-arm64-v8a
          path: dist/V2rayAG-arm64-v8a.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-armeabi-v7a
          path: dist/V2rayAG-armeabi-v7a.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-universal
          path: dist/V2rayAG-universal.apk
          if-no-files-found: ignore
      - name: Publish release (plain .apk downloads, no zip)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --title "V2rayAG build ${{ github.run_number }}" \
            --notes "arm64-v8a: most phones made after 2017. armeabi-v7a: older 32-bit phones. universal: works on all phones, larger file."
