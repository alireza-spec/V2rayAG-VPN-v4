name: build-apk
on:
  workflow_dispatch: {}
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create project and unpack V2rayAG code
        run: |
          flutter create --org com.v2rayag --project-name v2rayag --platforms android .
          echo "" | base64 -d | tar xz
          cp -r overlay/lib/. lib/
          cp -r overlay/test/. test/
          cp -r overlay/assets assets
          cp overlay/flutter_launcher_icons.yaml .
          rm -f test/widget_test.dart
          mkdir -p android/app/src/main/res/drawable
          cp overlay/android/app/src/main/res/drawable/* android/app/src/main/res/drawable/
          sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#your_app#v2rayag#' test/pool_engine_test.dart
          F=$(find android/app/src/main -name MainActivity.kt | head -1)
          P=$(head -1 "$F")
          cat > "$F" <<KT
          $P
          import android.Manifest
          import android.os.Build
          import android.os.Bundle
          import io.flutter.embedding.android.FlutterActivity
          class MainActivity : FlutterActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  if (Build.VERSION.SDK_INT >= 33) requestPermissions(arrayOf(Manifest.permission.POST_NOTIFICATIONS), 1)
              }
          }
          KT
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 24/; s/minSdkVersion flutter.minSdkVersion/minSdkVersion 24/' android/app/build.gradle.kts android/app/build.gradle 2>/dev/null || true
          flutter pub add flutter_vless
      - name: App icon
        continue-on-error: true
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons
      - name: Run tests
        run: flutter test
        continue-on-error: true
      - name: Build APK
        env:
          POOL_LIST: ${{ secrets.POOL_LIST }}
          POOL_URL: ${{ secrets.POOL_URL }}
        run: |
          LIST=$(printf '%s' "$POOL_LIST" | tr '\r\n' ',,' | sed 's/,,*/,/g;s/^,//;s/,$//')
          flutter build apk --release --split-per-abi --dart-define=POOL_LIST="$LIST" --dart-define=POOL_URL="$POOL_URL"
      - name: Collect APKs by architecture
        run: |
          mkdir -p dist
          D=build/app/outputs/flutter-apk
          cp "$D/app-arm64-v8a-release.apk" dist/V2rayAG-arm64-v8a.apk || true
          cp "$D/app-armeabi-v7a-release.apk" dist/V2rayAG-armeabi-v7a.apk || true
      - name: Build universal APK
        continue-on-error: true
        env:
          POOL_LIST: ${{ secrets.POOL_LIST }}
          POOL_URL: ${{ secrets.POOL_URL }}
        run: |
          LIST=$(printf '%s' "$POOL_LIST" | tr '\r\n' ',,' | sed 's/,,*/,/g;s/^,//;s/,$//')
          flutter build apk --release --dart-define=POOL_LIST="$LIST" --dart-define=POOL_URL="$POOL_URL"
          cp build/app/outputs/flutter-apk/app-release.apk dist/V2rayAG-universal.apk
      - name: List files
        run: ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-arm64-v8a
          path: dist/V2rayAG-arm64-v8a.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-armeabi-v7a
          path: dist/V2rayAG-armeabi-v7a.apk
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: V2rayAG-universal
          path: dist/V2rayAG-universal.apk
          if-no-files-found: ignore
      - name: Publish release (plain .apk downloads, no zip)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.apk \
            --title "V2rayAG build ${{ github.run_number }}" \
            --notes "arm64-v8a: most phones made after 2017. armeabi-v7a: older 32-bit phones. universal: works on all phones, larger file."
